<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Brilliant Daily</title>
<link rel="icon" href="https://img.cdn1.vip/i/6a0d663ee37bc_1779263038.jpeg">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
gap:10px;
flex-wrap:wrap;
}

h1{
font-size:32px;
color:#60a5fa;
}

.userinfo{
color:#94a3b8;
font-size:14px;
}

.card{
background:#1e293b;
padding:18px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

input,
textarea{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#334155;
color:white;
font-size:16px;
outline:none;
}

textarea{
resize:none;
min-height:120px;
}

input:focus,
textarea:focus{
outline:2px solid #3b82f6;
}

button{
margin-top:12px;
padding:14px;
border:none;
border-radius:12px;
background:#3b82f6;
color:white;
font-size:16px;
cursor:pointer;
transition:0.2s;
width:100%;
}

button:hover{
background:#2563eb;
}

.logout{
background:#ef4444;
}

.logout:hover{
background:#dc2626;
}

.post{
background:#1e293b;
padding:18px;
border-radius:18px;
margin-top:20px;
box-shadow:0 0 15px rgba(0,0,0,0.2);
}

.username{
font-weight:bold;
color:#60a5fa;
font-size:17px;
}

.content{
margin-top:12px;
line-height:1.7;
white-space:pre-wrap;
}

.time{
margin-top:12px;
font-size:13px;
color:#94a3b8;
}

.post-image{
width:100%;
margin-top:15px;
border-radius:14px;
max-height:500px;
object-fit:cover;
}

.delete-btn{
background:#ef4444;
margin-top:15px;
}

.notice{
background:#172554;
padding:15px;
border-radius:14px;
margin-bottom:20px;
line-height:1.7;
border:1px solid #2563eb;
}

@media(max-width:768px){

body{
padding:10px;
}

h1{
font-size:24px;
}

.card{
padding:15px;
}

button{
padding:13px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="topbar">

<h1>Brilliant Daily</h1>

<div class="userinfo" id="userinfo">
未登录
</div>

</div>

<div class="notice">

分享你的日常<br>
支持图片上传<br>
支持删除动态<br>
璀璨之光论坛

</div>

<!-- 登录 -->

<div class="card">

<h2>登录</h2>

<input
type="text"
id="username"
placeholder="输入用户名">

<button onclick="login()">
进入社区
</button>

<button
class="logout"
onclick="logout()">

退出登录

</button>

</div>

<!-- 发布 -->

<div class="card">

<h2>发布动态</h2>

<textarea
id="message"
placeholder="分享今天发生的事情..."></textarea>

<input
type="file"
id="imageInput"
accept="image/*">

<button onclick="sendPost()">
发布动态
</button>

</div>

<div id="posts"></div>

</div>

<script>

const SUPABASE_URL =
"https://geladutxkynmwwuwecae.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlbGFkdXR4a3lubXd3dXdlY2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyNjIxNDIsImV4cCI6MjA5NDgzODE0Mn0.tIotLyQKd-lwg83Pv-8ART4lGUsk4KHRG8WYjcMTbXg";

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentUser =
localStorage.getItem("daily_user");

const userinfo =
document.getElementById("userinfo");

function updateUser(){

if(currentUser){

userinfo.innerHTML =
"当前用户：" + currentUser;

}else{

userinfo.innerHTML =
"未登录";

}

}

updateUser();

/* 登录 */

window.login = function(){

const username =
document.getElementById("username").value;

if(!username){

alert("请输入用户名");

return;

}

localStorage.setItem(
"daily_user",
username
);

currentUser = username;

updateUser();

alert("登录成功");

}

/* 退出 */

window.logout = function(){

localStorage.removeItem(
"daily_user"
);

currentUser = null;

updateUser();

alert("已退出登录");

}

/* 发布 */

window.sendPost = async function(){

if(!currentUser){

alert("请先登录");

return;

}

const message =
document.getElementById("message").value;

const imageFile =
document.getElementById("imageInput").files[0];

let imageUrl = "";

if(imageFile){

const fileName =
Date.now() + "_" + imageFile.name;

const { error:uploadError } =
await supabase.storage

.from("images")

.upload(fileName,imageFile);

if(uploadError){

alert("图片上传失败");

console.log(uploadError);

return;

}

imageUrl =

`${SUPABASE_URL}/storage/v1/object/public/images/${fileName}`;

}

const { error } =
await supabase

.from("posts")

.insert([{

username:currentUser,

message:message,

image:imageUrl

}]);

if(error){

alert("发布失败");

console.log(error);

return;

}

document.getElementById("message").value = "";

document.getElementById("imageInput").value = "";

loadPosts();

}

/* 删除动态 */

async function deletePost(id){

const confirmDelete =
confirm("确定删除这个动态吗？");

if(!confirmDelete) return;

const { error } =
await supabase

.from("posts")

.delete()

.eq("id",id);

if(error){

alert("删除失败");

return;

}

loadPosts();

}

/* 加载动态 */

async function loadPosts(){

const { data,error } =
await supabase

.from("posts")

.select("*")

.order("created_at",{
ascending:false
});

if(error){

console.log(error);

return;

}

const postsDiv =
document.getElementById("posts");

postsDiv.innerHTML = "";

data.forEach(post=>{

postsDiv.innerHTML += `

<div class="post">

<div class="username">
${post.username}
</div>

<div class="content">
${post.message || ""}
</div>

${post.image ?

`<img
src="${post.image}"
class="post-image">`

: ""}

<div class="time">

${new Date(post.created_at)
.toLocaleString()}

</div>

${post.username === currentUser ?

`<button
class="delete-btn"
onclick="deletePost('${post.id}')">

删除动态

</button>`

: ""}

</div>

`;

});

}

loadPosts();

setInterval(loadPosts,3000);

</script>

</body>

</html>
